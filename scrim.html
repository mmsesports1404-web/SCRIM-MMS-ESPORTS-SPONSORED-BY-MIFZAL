<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMS LEGENDS - Official Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@600;700&display=swap');
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050203;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .font-teko { font-family: 'Teko', sans-serif; }
        
        /* Kesan Transisi Buku Selak */
        .page {
            display: none;
            animation: flipIn 0.5s ease-out forwards;
        }
        .page.active {
            display: block;
        }

        @keyframes flipIn {
            from {
                opacity: 0;
                transform: rotateY(-20deg) scale(0.95);
            }
            to {
                opacity: 1;
                transform: rotateY(0deg) scale(1);
            }
        }

        .book-container {
            perspective: 1000px;
        }

        .box-glow {
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- Header Navigation -->
    <header class="max-w-md mx-auto w-full flex justify-between items-center py-3 border-b border-red-900/50">
        <div class="flex items-center gap-2">
            <img src="ManaManaSandar%2020260825_220527.jpg" class="w-8 h-8 rounded-full border border-red-500">
            <span class="font-teko text-xl font-bold text-white tracking-wider">MMS <span class="text-red-600">LEGENDS</span></span>
        </div>
        <div class="text-xs text-red-400 font-bold tracking-widest bg-red-950/80 px-3 py-1 rounded border border-red-800">
            PAGE <span id="page-num">1</span> / 3
        </div>
    </header>

    <!-- Main Book Container -->
    <main class="book-container max-w-md mx-auto w-full my-auto py-6">

        <!-- ================= PAGE 1: UTAMA / LINEUP ================= -->
        <div id="page-1" class="page active bg-gradient-to-b from-zinc-900 via-black to-zinc-950 p-6 rounded-2xl border-2 border-red-800 box-glow text-center">
            <img src="ManaManaSandar%2020260825_220527.jpg" class="w-24 h-24 rounded-full border-2 border-red-500 mx-auto mb-3 shadow-lg">
            <h1 class="text-5xl font-teko font-bold text-white uppercase leading-none">MMS <span class="text-red-600">LEGENDS</span></h1>
            <p class="text-xs text-red-300 font-bold uppercase tracking-widest mb-6">"Pantang Undur, Kuasai Land of Dawn!"</p>

            <h2 class="text-2xl font-teko font-bold text-red-500 border-b border-red-900 pb-1 mb-4">📖 MUKA SURAT 1: LINEUP</h2>
            
            <div class="grid grid-cols-2 gap-2 text-left text-xs mb-4">
                <div class="bg-red-950/40 border border-red-900 p-2 rounded">
                    <span class="text-red-400 font-bold block text-[10px]">JUNGLER</span>
                    <span class="font-teko text-lg text-white font-bold">GONE</span>
                </div>
                <div class="bg-red-950/40 border border-red-900 p-2 rounded">
                    <span class="text-red-400 font-bold block text-[10px]">EXP LANER</span>
                    <span class="font-teko text-lg text-white font-bold">TATUT</span>
                </div>
                <div class="bg-red-950/40 border border-red-900 p-2 rounded">
                    <span class="text-red-400 font-bold block text-[10px]">GOLD LANER</span>
                    <span class="font-teko text-lg text-white font-bold">SHIKO</span>
                </div>
                <div class="bg-red-950/40 border border-red-900 p-2 rounded">
                    <span class="text-red-400 font-bold block text-[10px]">ROAMER</span>
                    <span class="font-teko text-lg text-white font-bold">SUPERBRAIN</span>
                </div>
            </div>
            <p class="text-[10px] text-gray-400">Tekan 'Seterusnya' untuk tempah Scrim ➡️</p>
        </div>

        <!-- ================= PAGE 2: BORANG SCRIM ================= -->
        <div id="page-2" class="page bg-gradient-to-b from-zinc-900 via-black to-zinc-950 p-6 rounded-2xl border-2 border-red-800 box-glow text-center">
            <h2 class="text-3xl font-teko font-bold text-red-500 border-b border-red-900 pb-1 mb-4">🔥 MUKA SURAT 2: TEMPAH SCRIM</h2>
            
            <form class="space-y-3 text-left text-xs">
                <div>
                    <label class="block text-gray-300 font-bold mb-1">Nama Squad / Pasukan:</label>
                    <input type="text" placeholder="Contoh: Mobile Legends Pro" class="w-full bg-black border border-red-900 rounded p-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-gray-300 font-bold mb-1">Nombor WhatsApp Kapten:</label>
                    <input type="tel" placeholder="012-3456789" class="w-full bg-black border border-red-900 rounded p-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-gray-300 font-bold mb-1">Format Scrim:</label>
                    <select class="w-full bg-black border border-red-900 rounded p-2 text-white">
                        <option>BO3 (Best of 3)</option>
                        <option>BO5 (Best of 5)</option>
                    </select>
                </div>
                <button type="button" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded text-sm uppercase font-teko tracking-wider mt-2">HANTAR TEMPAHAN SCRIM</button>
            </form>
        </div>

        <!-- ================= PAGE 3: BORANG TRYOUT ================= -->
        <div id="page-3" class="page bg-gradient-to-b from-zinc-900 via-black to-zinc-950 p-6 rounded-2xl border-2 border-red-800 box-glow text-center">
            <h2 class="text-3xl font-teko font-bold text-red-500 border-b border-red-900 pb-1 mb-4">⚡ MUKA SURAT 3: TRYOUT SQUAD</h2>
            
            <form class="space-y-3 text-left text-xs">
                <div>
                    <label class="block text-gray-300 font-bold mb-1">In-Game Name (IGN) & ID:</label>
                    <input type="text" placeholder="Contoh: MMS_Player (1234567)" class="w-full bg-black border border-red-900 rounded p-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-gray-300 font-bold mb-1">Role Utama:</label>
                    <select class="w-full bg-black border border-red-900 rounded p-2 text-white">
                        <option>Jungler</option>
                        <option>Roamer</option>
                        <option>Midlaner</option>
                        <option>Goldlaner</option>
                        <option>EXP Laner</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-300 font-bold mb-1">Rank Tertinggi (Highest Rank):</label>
                    <input type="text" placeholder="Contoh: Mythic Immortal 100 Stars" class="w-full bg-black border border-red-900 rounded p-2 text-white focus:outline-none focus:border-red-500">
                </div>
                <button type="button" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded text-sm uppercase font-teko tracking-wider mt-2">MOHON TRYOUT</button>
            </form>
        </div>

    </main>

    <!-- Footer / Button Selak Buku -->
    <footer class="max-w-md mx-auto w-full flex justify-between gap-3 pt-2">
        <button id="btn-prev" onclick="changePage(-1)" class="flex-1 bg-zinc-900 border border-red-900 text-gray-400 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-1 disabled:opacity-30">
            <i class="fas fa-chevron-left"></i> Sebelumnya
        </button>
        <button id="btn-next" onclick="changePage(1)" class="flex-1 bg-red-600 border border-red-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-1">
            Seterusnya <i class="fas fa-chevron-right"></i>
        </button>
    </footer>

    <!-- Logic Selak Buku -->
    <script>
        let currentPage = 1;
        const totalPages = 3;

        function updatePageDisplay() {
            // Sembunyikan semua page
            for (let i = 1; i <= totalPages; i++) {
                document.getElementById(`page-${i}`).classList.remove('active');
            }
            // Tunjukkan page semasa
            document.getElementById(`page-${currentPage}`).classList.add('active');
            
            // Kemaskini nombor muka surat di header
            document.getElementById('page-num').innerText = currentPage;

            // Kawal butang aktif/tidak
            document.getElementById('btn-prev').disabled = (currentPage === 1);
            document.getElementById('btn-next').disabled = (currentPage === totalPages);
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            updatePageDisplay();
        }

        // Jalankan tetapan awal
        updatePageDisplay();
    </script>
</body>
</html>
