<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMS LEGENDS - Official Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff003c;
      --primary-glow: rgba(255, 0, 60, 0.6);
      --bg-dark: #0a0a0c;
      --card-bg: rgba(18, 18, 24, 0.85);
      --text-light: #f1f1f1;
      --border-color: rgba(255, 0, 60, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(255, 0, 60, 0.15) 0%, transparent 60%),
        linear-gradient(to bottom, #050507, #0a0a0c);
      background-attachment: fixed;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* HEADER / NAVBAR */
    header {
      background: rgba(10, 10, 12, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
    }

    .nav-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-box img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--primary);
    }

    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: rgba(255, 0, 60, 0.1);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 800px;
      margin: 30px auto 0;
      padding: 0 15px;
    }

    /* SECTIONS */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HOME HERO SECTION */
    .hero {
      text-align: center;
      padding: 30px 10px;
    }

    .hero-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 0 25px var(--primary-glow);
      margin-bottom: 15px;
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .hero p {
      color: #ccc;
      font-style: italic;
      font-size: 1.1rem;
    }

    /* CARD STYLES FOR FORMS & LINEUP */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      margin-top: 20px;
    }

    .card h2 {
      font-family: 'Orbitron', sans-serif;
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 700;
      color: #ddd;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 8px var(--primary-glow);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      margin-top: 10px;
      transition: 0.3s;
    }

    .submit-btn:hover {
      box-shadow: 0 0 15px var(--primary-glow);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="nav-container">
      <div class="logo-box">
        <img src="logo.png" alt="MMS Logo" onerror="this.style.display='none'">
        <span class="logo-text">MMS LEGENDS</span>
      </div>
      <div class="nav-btns">
        <button class="nav-btn active" onclick="switchTab('home')">🏠 UTAMA</button>
        <button class="nav-btn" onclick="switchTab('scrim')">🔥 SCRIM</button>
        <button class="nav-btn" onclick="switchTab('tryout')">⚡ TRYOUT</button>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- TAB 1: HOME / LINEUP -->
    <div id="home" class="tab-content active">
      <div class="hero">
        <img src="logo.png" alt="MMS Logo" class="hero-img" onerror="this.src='https://via.placeholder.com/130/ff003c/ffffff?text=MMS'">
        <h1>MMS LEGENDS</h1>
        <p>"PANTANG UNDUR, KUASAI LAND OF DAWN!"</p>
      </div>

      <div class="card">
        <h2>OFFICIAL LINEUP 2026</h2>
        <p style="text-align: center; color: #aaa;">Senarai pemain rasmi MMS Legends akan dipaparkan di sini.</p>
      </div>
    </div>

    <!-- TAB 2: SCRIM FORM -->
    <div id="scrim" class="tab-content">
      <div class="card">
        <h2>🔥 BORANG PERMOHONAN SCRIM</h2>
        <form id="scrimForm">
          <div class="form-group">
            <label>Nama Pasukan / Squad:</label>
            <input type="text" placeholder="Masukkan nama pasukan anda" required>
          </div>
          <div class="form-group">
            <label>Nama Kapten / Nombor WhatsApp:</label>
            <input type="text" placeholder="Contoh: 012-3456789" required>
          </div>
          <div class="form-group">
            <label>Cadangan Tarikh & Masa Scrim:</label>
            <input type="datetime-local" required>
          </div>
          <div class="form-group">
            <label>Format Scrim:</label>
            <select>
              <option>BO3 (Best of 3)</option>
              <option>BO5 (Best of 5)</option>
              <option>Custom / Custom Ban</option>
            </select>
          </div>
          <button type="submit" class="submit-btn">HANTAR PERMOHONAN SCRIM</button>
        </form>
      </div>
    </div>

    <!-- TAB 3: TRYOUT FORM -->
    <div id="tryout" class="tab-content">
      <div class="card">
        <h2>⚡ BORANG TRYOUT MMS LEGENDS</h2>
        <form id="tryoutForm">
          <div class="form-group">
            <label>In-Game Name (IGN) & ID:</label>
            <input type="text" placeholder="Contoh: MMS_Shadow (12345678)" required>
          </div>
          <div class="form-group">
            <label>Main Role / Peranan Utama:</label>
            <select>
              <option>Jungler</option>
              <option>Roamer</option>
              <option>Midlaner</option>
              <option>Goldlaner</option>
              <option>EXP Laner</option>
            </select>
          </div>
          <div class="form-group">
            <label>Current Rank / Highest Rank:</label>
            <input type="text" placeholder="Contoh: Mythical Immortal 100 Stars" required>
          </div>
          <div class="form-group">
            <label>Nombor WhatsApp:</label>
            <input type="text" placeholder="012-3456789" required>
          </div>
          <button type="submit" class="submit-btn">HANTAR PERMOHONAN TRYOUT</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    function switchTab(tabId) {
      // Sembunyikan semua tab
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });

      // Nyahaktifkan semua butang
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      // Tunjukkan tab yang dipilih
      document.getElementById(tabId).classList.add('active');

      // Aktifkan butang yang ditekan
      event.currentTarget.classList.add('active');
    }
  </script>
</body>
    </html>
