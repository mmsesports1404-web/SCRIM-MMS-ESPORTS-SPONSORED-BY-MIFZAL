<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIM ORDER FORM - MMS ESPORTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600&family=Rajdhani:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        esports: {
                            red: '#FF0B3A',
                            darkRed: '#8B0000',
                            gold: '#D4AF37',
                            bg: '#0A0A0F',
                            card: '#12131A'
                        }
                    },
                    fontFamily: {
                        teko: ['Teko', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        inter: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0f; color: #ffffff; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- HEADER / FORM TITLE -->
    <div class="bg-esports-card p-4 rounded-xl border border-red-900/50 mb-4 shadow-lg">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold font-rajdhani text-white flex items-center gap-2">
                🎮 SCRIM ORDER FORM
            </h1>
            <span class="bg-red-900/40 text-red-400 text-xs px-2 py-1 rounded font-bold">MLBB 5V5</span>
        </div>

        <form id="scrimForm" onsubmit="return false;" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">👥 NAME TEAM *</label>
                <input type="text" id="teamNameInput" placeholder="Contoh: KANIKAMA ESPORTS" class="w-full bg-black/50 border border-gray-800 rounded p-2.5 text-sm text-white focus:outline-none focus:border-red-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">⏰ TIME *</label>
                    <input type="text" id="scrimTimeInput" placeholder="9:00 PM" class="w-full bg-black/50 border border-gray-800 rounded p-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">PILIHAN MASA</label>
                    <select onchange="document.getElementById('scrimTimeInput').value = this.value; updatePreview();" class="w-full bg-black/50 border border-gray-800 rounded p-2.5 text-sm text-white focus:outline-none">
                        <option value="8:00 PM">8:00 PM</option>
                        <option value="9:00 PM" selected>9:00 PM</option>
                        <option value="10:00 PM">10:00 PM</option>
                        <option value="11:00 PM">11:00 PM</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">🏆 FORMAT *</label>
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <button type="button" onclick="setFormat('BO3')" class="bg-black/50 border border-gray-800 py-1.5 rounded text-xs font-bold text-gray-300 hover:border-red-500">BO3</button>
                    <button type="button" onclick="setFormat('BO5')" class="bg-black/50 border border-gray-800 py-1.5 rounded text-xs font-bold text-gray-300 hover:border-red-500">BO5</button>
                    <button type="button" onclick="setFormat('BO7')" class="bg-black/50 border border-gray-800 py-1.5 rounded text-xs font-bold text-gray-300 hover:border-red-500">BO7</button>
                </div>
                <input type="text" id="scrimFormatInput" value="BO3" class="w-full bg-black/50 border border-gray-800 rounded p-2.5 text-sm text-white focus:outline-none focus:border-red-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">⭐ AVERAGE (STARS / RANK) *</label>
                <input type="text" id="scrimAverageInput" placeholder="100+ Star" class="w-full bg-black/50 border border-gray-800 rounded p-2.5 text-sm text-white focus:outline-none focus:border-red-500">
                <p class="text-[10px] text-yellow-500 mt-1">⚡ Requirement standard MMS Esports: 100+ Stars ke atas.</p>
            </div>
        </form>
    </div>

    <!-- PREVIEW & WHATSAPP SECTION -->
    <div class="bg-esports-card p-4 rounded-xl border border-yellow-600/40 shadow-lg space-y-3">
        <div class="flex justify-between items-center">
            <h2 class="text-yellow-500 font-bold font-rajdhani flex items-center gap-2">
                <i class="fab fa-whatsapp text-green-500"></i> FORMAT DM WHATSAPP
            </h2>
            <span class="bg-yellow-500/20 text-yellow-400 text-[10px] px-2 py-0.5 rounded font-mono">AUTO SYNC</span>
        </div>

        <!-- TEXTAREA PREVIEW -->
        <textarea id="previewText" readonly rows="8" class="w-full bg-black/70 border border-gray-800 rounded p-3 text-xs font-mono text-gray-300 focus:outline-none resize-none"></textarea>

        <!-- BUTANG HANTAR WHATSAPP -->
        <button type="button" onclick="sendToWhatsApp()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-extrabold py-3 rounded-lg flex items-center justify-center gap-2 text-sm transition shadow-lg shadow-emerald-900/30">
            <i class="fab fa-whatsapp text-lg"></i> HANTAR ORDER KE WHATSAPP
        </button>

        <!-- BUTANG SALIN TEKS -->
        <button type="button" onclick="copyFormatText()" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold py-2.5 rounded-lg text-xs flex items-center justify-center gap-2 transition">
            <i class="far fa-copy"></i> SALIN TEKS FORMAT SCRIM
        </button>
    </div>

    <!-- FOOTER DIRECT DM -->
    <div class="mt-4 p-4 text-center border border-red-900/30 rounded-xl bg-black/40">
        <p class="text-xs text-gray-400">DIRECT DM WHATSAPP CONTACT</p>
        <p class="text-xl font-bold text-red-500 font-rajdhani my-1"><i class="fas fa-phone-alt text-sm mr-1"></i> 0178153522</p>
        <a href="https://wa.me/60178153522" target="_blank" class="text-xs text-red-400 underline hover:text-red-300">Klik sini untuk terus chat 0178153522 →</a>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const teamNameInput = document.getElementById('teamNameInput');
        const scrimTimeInput = document.getElementById('scrimTimeInput');
        const scrimFormatInput = document.getElementById('scrimFormatInput');
        const scrimAverageInput = document.getElementById('scrimAverageInput');
        const previewText = document.getElementById('previewText');

        function setFormat(val) {
            scrimFormatInput.value = val;
            updatePreview();
        }

        function updatePreview() {
            const team = teamNameInput.value.trim() || '____';
            const time = scrimTimeInput.value.trim() || '____';
            const format = scrimFormatInput.value.trim() || '____';
            const average = scrimAverageInput.value.trim() || '____';

            const formattedMessage = `🔥 *SCRIM ORDER BY MMS ESPORTS MALAYSIA* 🔥\n👑 *SPONSORED BY MIFZAL* 👑\n\n📌 *NAME TEAM:* ${team}\n⏰ *TIME:* ${time}\n⚔️ *FORMAT:* ${format}\n⭐ *AVERAGE:* ${average}\n\n📲 *DM WHATSAPP:* 0178153522`;

            if (previewText) {
                previewText.value = formattedMessage;
            }
        }

        function sendToWhatsApp() {
            const team = teamNameInput.value.trim();
            const time = scrimTimeInput.value.trim();
            const format = scrimFormatInput.value.trim();
            const average = scrimAverageInput.value.trim();

            if (!team || !time || !format || !average) {
                alert("Sila lengkapkan semua maklumat borang!");
                return;
            }

            const rawText = `🔥 *SCRIM ORDER BY MMS ESPORTS MALAYSIA* 🔥\n👑 *SPONSORED BY MIFZAL* 👑\n\n📌 *NAME TEAM:* ${team}\n⏰ *TIME:* ${time}\n⚔️ *FORMAT:* ${format}\n⭐ *AVERAGE:* ${average}\n\n📲 *DM WHATSAPP:* 0178153522`;

            const encodedText = encodeURIComponent(rawText);
            window.location.href = `https://wa.me/60178153522?text=${encodedText}`;
        }

        function copyFormatText() {
            previewText.select();
            navigator.clipboard.writeText(previewText.value);
            alert("Format SCRIM berjaya disalin!");
        }

        // Event Listeners
        [teamNameInput, scrimTimeInput, scrimFormatInput, scrimAverageInput].forEach(input => {
            if (input) {
                input.addEventListener('input', updatePreview);
                input.addEventListener('change', updatePreview);
            }
        });

        // Jana preview awal
        updatePreview();
    </script>
</body>
            </html>
